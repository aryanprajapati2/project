<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SnapScape</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav>
        <a href="index.html" class="logo">SnapScape</a>

        <ul class="nav-links">
            <li><a href="index.html#explore">Explore</a></li>
            <li><a href="join.html">Join</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="form-container">
        <h2>Join SnapScape</h2>

        <p>
            Become part of the SnapScape community and explore creative photography collections.
        </p>

        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">

            <input type="submit" value="Join Now">
        </form>
    </section>

    <section class="form-container" style="margin-top: 30px;">
        <h2>Request to Join</h2>

        <p>
            You can also request access by sending us an email.
        </p>

        <a href="mailto:snapscapegallery@gmail.com">
            <input type="submit" value="Send Us Mail">
        </a>
    </section>

</main>

</body>
</html>
